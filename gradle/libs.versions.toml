[versions]
agp                  = "8.5.2"
kotlin               = "2.0.20"
ksp                  = "2.0.20-1.0.25"
hilt                 = "2.52"
hilt-navigation      = "1.2.0"
compose-bom          = "2024.09.02"
navigation-compose   = "2.8.1"
lifecycle            = "2.8.6"
activity-compose     = "1.9.2"
core-ktx             = "1.13.1"
room                 = "2.6.1"
retrofit             = "2.11.0"
okhttp               = "4.12.0"
coil                 = "2.7.0"
kotlinx-serialization = "1.7.3"
kotlinx-coroutines   = "1.9.0"
workmanager          = "2.9.1"
hilt-work            = "1.2.0"
datastore            = "1.1.1"
junit                = "5.11.0"
junit-android        = "1.2.1"
espresso             = "3.6.1"
mockk                = "1.13.12"
truth                = "1.4.4"
turbine              = "1.1.0"

[libraries]
androidx-core-ktx          = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-activity-compose  = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

compose-bom            = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui             = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics    = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling     = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3      = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-navigation     = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

hilt-android           = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler          = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation" }
hilt-work              = { group = "androidx.hilt", name = "hilt-work", version.ref = "hilt-work" }
hilt-work-compiler     = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hilt-work" }

room-runtime           = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx               = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler          = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

retrofit               = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version = "1.0.0" }
okhttp                 = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging         = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

coil-compose           = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

workmanager-ktx        = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }
datastore-preferences  = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

junit-bom              = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter          = { group = "org.junit.jupiter", name = "junit-jupiter" }
mockk                  = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
truth                  = { group = "com.google.truth", name = "truth", version.ref = "truth" }
turbine                = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

room-testing           = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-junit         = { group = "androidx.test.ext", name = "junit", version.ref = "junit-android" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-application    = { id = "com.android.application", version.ref = "agp" }
kotlin-android         = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose         = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization   = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                    = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                   = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
